version: '3.8'

services:
  # Nginx Load Balancer with IP hash sticky sessions and WebSocket upgrade
  nginx:
    image: nginx:alpine
    container_name: securechat-lb
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-server-1
      - chat-server-2
      - chat-server-3

  # Horizontally Scaled Chat Server Instance 1
  chat-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securechat-server-1
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=your_jwt_access_secret_change_in_production_32chars
      - MONGODB_URI=mongodb://mongodb:27017/securechat
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=*
      - MESSAGE_RATE_LIMIT_WINDOW_SECS=60
      - MESSAGE_RATE_LIMIT_MAX=30
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # Horizontally Scaled Chat Server Instance 2
  chat-server-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securechat-server-2
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=your_jwt_access_secret_change_in_production_32chars
      - MONGODB_URI=mongodb://mongodb:27017/securechat
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=*
      - MESSAGE_RATE_LIMIT_WINDOW_SECS=60
      - MESSAGE_RATE_LIMIT_MAX=30
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # Horizontally Scaled Chat Server Instance 3
  chat-server-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securechat-server-3
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=your_jwt_access_secret_change_in_production_32chars
      - MONGODB_URI=mongodb://mongodb:27017/securechat
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=*
      - MESSAGE_RATE_LIMIT_WINDOW_SECS=60
      - MESSAGE_RATE_LIMIT_MAX=30
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  mongodb:
    image: mongo:7.0
    container_name: securechat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: securechat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
